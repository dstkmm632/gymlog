<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог упражнений — GymLog</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html"><img src="img/logo.svg" alt="GymLog — на главную" width="100" height="44"></a>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html" class="active">Каталог</a></li>
                    <li><a href="diary.html">Дневник</a></li>
                    <li><a href="contacts.html">Контакты</a></li>
                    <li><a href="login.html">Вход</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Каталог упражнений</h1>
        <p>Все упражнения, которые можно добавить в дневник.</p>

        <form id="filter-form" class="filter" action="#" method="get">
            <div>
                <label for="search">Поиск</label>
                <input type="search" id="search" name="search" placeholder="Название упражнения">
            </div>
            <div>
                <label for="muscle">Группа мышц</label>
                <select id="muscle" name="muscle">
                    <option value="">Все</option>
                    <option value="legs">Ноги</option>
                    <option value="chest">Грудь</option>
                    <option value="back">Спина</option>
                    <option value="shoulders">Плечи</option>
                    <option value="arms">Руки</option>
                    <option value="core">Пресс</option>
                </select>
            </div>
            <div>
                <label for="sort">Сортировка</label>
                <select id="sort" name="sort">
                    <option value="name">По названию</option>
                    <option value="level">По сложности</option>
                </select>
            </div>
            <button type="submit" class="btn">Найти</button>
        </form>

        <h2>Все упражнения</h2>
        <p id="catalog-status">Загрузка упражнений...</p>
        <ul class="cards" id="exercise-list"></ul>
        <p id="nothing-found" class="is-hidden">Ничего не найдено. Попробуйте изменить поиск.</p>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 GymLog. Учебный проект.</p>
        </div>
    </footer>
</body>
</html>
