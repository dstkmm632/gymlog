<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Контакты — GymLog</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html"><img src="img/logo.svg" alt="GymLog — на главную" width="100" height="44"></a>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="diary.html">Дневник</a></li>
                    <li><a href="contacts.html" class="active">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Контакты</h1>

        <address>
            <p>Адрес: г. Санкт-Петербург, ул. Спортивная, д. 7</p>
            <p>Телефон: <a href="tel:+78120000000">+7 (812) 000-00-00</a></p>
            <p>Почта: <a href="mailto:gymlog@example.com">gymlog@example.com</a></p>
        </address>
        <p>Режим работы: пн–пт с 10:00 до 19:00, сб–вс выходной.</p>

        <h2>Обратная связь</h2>
        <form id="feedback-form" action="#" method="post" novalidate>
            <label for="name">Имя</label>
            <input type="text" id="name" name="name" required aria-describedby="name-error">
            <p class="error" id="name-error"></p>

            <label for="email">Почта</label>
            <input type="email" id="email" name="email" required aria-describedby="email-error">
            <p class="error" id="email-error"></p>

            <label for="message">Сообщение</label>
            <textarea id="message" name="message" rows="5" required aria-describedby="message-error"></textarea>
            <p class="error" id="message-error"></p>

            <button type="submit" class="btn">Отправить</button>
            <p class="result" id="feedback-result"></p>
        </form>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 GymLog. Учебный проект.</p>
        </div>
    </footer>
</body>
</html>
